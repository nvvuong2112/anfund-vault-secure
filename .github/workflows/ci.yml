name: CI

on:
  # push và pull_request bị vô hiệu hoá vì tài khoản GitHub chưa có phương thức
  # thanh toán. Actions không cấp runner: mọi lượt chạy chết sau 2 giây với
  # "The job was not started because your account is locked due to a billing
  # issue" (đã tái hiện y hệt qua 2 lượt, runner_id: 0, không có log). Để nguyên
  # thì mỗi PR và mỗi push nhận 2 check đỏ vĩnh viễn không mang thông tin gì —
  # và lỗi thật sau này sẽ lẫn vào đúng chỗ nhiễu đó.
  #
  # Bộ kiểm tra hiện chạy trong build Vercel, xem script "check" ở package.json.
  # Khi tài khoản có thẻ: bỏ chú thích 3 dòng dưới là workflow chạy lại y như cũ.
  # Toàn bộ phần còn lại của tệp đã được chứng minh là parse đúng và lên lịch
  # job đúng — thứ duy nhất thiếu là runner.
  #
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

# Đẩy commit mới lên cùng một PR thì huỷ lượt chạy cũ, khỏi tốn runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nhóm kiểm tra nhanh — chạy trong khoảng một phút, là thứ chặn merge chính.
  checks:
    name: Kiểm tra tĩnh và unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cài bun bằng script chính thức thay vì action của bên thứ ba, để
      # workflow chỉ phụ thuộc các action do GitHub phát hành.
      - name: Cài bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # --frozen-lockfile: nếu package.json và bun.lockb lệch nhau thì hỏng ở
      # đây, đúng lúc cần biết. Repo này từng có một lockfile lệch suốt 4 tháng.
      - name: Cài phụ thuộc
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Kiểm tra định dạng
        run: bunx prettier --check .

      - name: Unit test
        run: bun run test

      - name: Build
        run: bun run build

  # Tách riêng: cần tải trình duyệt nên chậm hơn hẳn. Để nhóm trên biết kết quả
  # sớm thay vì phải chờ cả E2E.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Cài phụ thuộc
        run: bun install --frozen-lockfile

      # Chỉ Chromium — playwright.config.ts cũng chỉ khai báo một project.
      - name: Cài trình duyệt
        run: bunx playwright install --with-deps chromium

      - name: Chạy E2E
        run: bun run test:e2e

      - name: Lưu báo cáo khi thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
